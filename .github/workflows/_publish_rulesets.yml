name: Publish rulesets

on:
  workflow_call:
    inputs:
      rulesets_dir:
        required: true
        type: string
        description: "Directory containing the generated rulesets"
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ inputs.rulesets_dir }}
          merge-multiple: true

      - name: Create zip
        run: zip -r osv-rules.zip ${{ inputs.rulesets_dir }}/

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          TAG="$(date -u +'%Y%m%d-%H%M')"
          gh release create "$TAG" osv-rules.zip \
            --title "OSV Rules ($TAG)" \
            --notes "Auto-generated OSV rulesets. Updated $(date -u +'%Y-%m-%d %H:%M UTC')." \
            --latest
