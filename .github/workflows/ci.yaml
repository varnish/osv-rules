name: CI Pipeline

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

concurrency:
  group: osv-rules-ci
  cancel-in-progress: false

jobs:
  generate:
    strategy:
      matrix:
        ecosystem:
          - go
          - hex
          - maven
          - npm
          - nuget
          - pypi
          - vscode
        include:
          # VSCode has only a handful of OSV rules, so require just the
          # header plus one rule.
          - ecosystem: vscode
            min_lines: 10
    uses: ./.github/workflows/_osv_rulegen.yml
    with:
      ecosystem: ${{ matrix.ecosystem }}
      rulesets_dir: rulesets
      min_lines: ${{ matrix.min_lines || 20 }}

  commit:
    needs: generate
    permissions:
      contents: write
    uses: ./.github/workflows/_commit.yml
    with:
      rulesets_dir: rulesets
    secrets:
      app_id: ${{ secrets.APP_ID }}
      app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
